# Bern Research & Economic Development Navigator — Phase 1 source registry
# Initial crawl config. These seeds are not blanket crawling authorization.
# Verify each origin's robots.txt and website terms at runtime.
schema_version: "1.0"

settings:
  user_agent: "BernResearchNavigator/0.1 (+REPLACE-WITH-REAL-CONTACT-URL)"
  data_dir: "data"
  respect_robots_txt: true
  block_unreviewed_terms: true
  allow_private_ips: false
  allowed_schemes: ["https", "http"]
  allowed_content_types: ["text/html", "application/xhtml+xml", "application/pdf"]
  concurrency_per_host: 2
  requests_per_second_per_host: 1.0
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_redirects: 5
  retries: 3
  default_max_depth: 3
  default_max_pages: 100
  default_max_pdfs: 30
  max_html_mb: 8
  max_pdf_mb: 35
  deny_query_params: ["fbclid", "gclid", "session", "sessionid"]
  strip_tracking_param_prefixes: ["utm_"]
  deny_path_regex:
    - '(?i)/(?:login|logout|signin|register|account|cart|checkout)(?:/|$)'
    - '(?i)/(?:calendar|events)/\d{4}/\d{1,2}/\d{1,2}(?:/|$)'
  # An external URL is always candidate-only until registered explicitly.
  follow_unregistered_external_links: false

sources:
  - id: berninvest
    organization: Bern Economic Development Agency
    enabled: true
    priority: P0
    terms_review_status: pending  # change to approved only after human review
    seed_urls:
      - https://www.berninvest.be.ch/en/start/standort/innovationsoekosystem.html
      - https://www.berninvest.be.ch/en/start/standort/innovationsoekosystem/forschung-entwicklung.html
      - https://www.berninvest.be.ch/en/start/dienstleistungen.html
    allowed_hosts: [www.berninvest.be.ch]
    allowed_path_prefixes:
      www.berninvest.be.ch:
        - /en/start/standort/innovationsoekosystem
        - /en/start/dienstleistungen
    max_depth: 3
    max_pages: 100
    max_pdfs: 20
    language_hints: [en]

