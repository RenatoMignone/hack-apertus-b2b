# Draft domain-profile source input; no parser/collector implemented or live crawl verified.
# Current seeds are dated observations from docs/challenge/PILOT_SCOPE.md.
# Core pipeline reads configuration; domains and taxonomy never belong in engine code.
schema_version: "1.0"
domain_profile_id: bern_diabetes_technology
domain_profile_version: "draft-2026-10-18"
required_source_families: [unibe, artorg, dcb]
output_language: en
source_language_hints: [en, de, fr, it]

settings:
  user_agent: "BernResearchNavigator/0.1 (+REPLACE-WITH-REAL-CONTACT-URL)"
  data_dir: "data"
  respect_robots_txt: true
  # Automatic access-policy checks; pending terms are not a blanket human gate.
  # Actual robots/terms blocks and ambiguities pause the affected origin for review.
  block_unreviewed_terms: false
  allow_private_ips: false
  allowed_schemes: [https, http]
  allowed_content_types: [text/html, application/xhtml+xml, application/pdf]
  concurrency_per_host: 2
  requests_per_second_per_host: 1.0
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_redirects: 5
  retries: 3
  default_max_depth: 3
  default_max_pages: 100
  default_max_pdfs: 30
  max_html_mb: 8
  max_pdf_mb: 35
  deny_query_params: [fbclid, gclid, session, sessionid]
  strip_tracking_param_prefixes: [utm_]
  deny_path_regex:
    - '(?i)/(?:login|logout|signin|register|account|cart|checkout)(?:/|$)'
    - '(?i)/(?:calendar|events)/\d{4}/\d{1,2}/\d{1,2}(?:/|$)'
  follow_unregistered_external_links: false

# Workbook import extends these candidates after exact-host/path and access checks.
# Preserve workbook hash/sheet/row and distinguish DCB from UniBE-domain entries.
discovery_workbook:
  path: ../../provided_material/unibe_sous_domaines_publics_etendus.xlsx
  sheet: Sous-domaines UniBE
  url_column: C
  observed_data_rows: 42
  notes_reported_rows: 71

sources:
  - id: unibe_bally_lab
    organization: University of Bern — DBMR
    source_family_ids: [unibe]
    enabled: true
    priority: P0
    terms_review_status: pending
    seed_urls:
      - https://www.dbmr.unibe.ch/research/research_programs/bally_lab/index_eng.html
    allowed_hosts: [www.dbmr.unibe.ch]
    allowed_path_prefixes:
      www.dbmr.unibe.ch: [/research/research_programs/bally_lab/]
    language_hints: [en, de]

  - id: artorg_research
    organization: ARTORG Center for Biomedical Engineering Research
    source_family_ids: [unibe, artorg]
    enabled: true
    priority: P0
    terms_review_status: pending
    seed_urls:
      - https://www.artorg.unibe.ch/research/index_eng.html
      - https://www.artorg.unibe.ch/research/aihn/research_activities/intelligent_nutrition/index_eng.html
      - https://www.artorg.unibe.ch/research/aihn/research_activities/adaptive_diabetes_management/index_eng.html
    allowed_hosts: [www.artorg.unibe.ch]
    allowed_path_prefixes:
      www.artorg.unibe.ch: [/research/]
    language_hints: [en, de]

  - id: dcb_projects
    organization: Diabetes Center Berne
    source_family_ids: [dcb]
    enabled: true
    priority: P0
    terms_review_status: pending
    seed_urls:
      - https://www.dcberne.com/en/projects/
      - https://www.dcberne.com/en/four-dcb-professorships-advance-research-in-diabetes-technology/
    allowed_hosts: [www.dcberne.com]
    allowed_exact_paths:
      www.dcberne.com:
        - /en/four-dcb-professorships-advance-research-in-diabetes-technology/
    allowed_path_prefixes:
      www.dcberne.com: [/en/projects/]
    language_hints: [en, de]

  # Additional candidates remain disabled until relevance and access are checked.
  - id: unibe_directory
    organization: University of Bern — Institute Directory
    source_family_ids: [unibe]
    enabled: false
    priority: P1
    terms_review_status: pending
    seed_urls:
      - https://www.institutionensuche.unibe.ch/neu/index.php?lang=en
    allowed_hosts: [www.institutionensuche.unibe.ch]
    allowed_path_prefixes:
      www.institutionensuche.unibe.ch: [/neu/]
    adapter: university_institute_directory
    max_pdfs: 0
    language_hints: [en, de]
