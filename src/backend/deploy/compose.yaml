name: bern-navigator

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      NAVIGATOR_MIGRATOR_PASSWORD: ${NAVIGATOR_MIGRATOR_PASSWORD:?Required}
      LANGGRAPH_PASSWORD: ${LANGGRAPH_PASSWORD:?Required}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?Required}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required}
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000", "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"]
    volumes: ["artifacts:/data"]

  storage-init:
    image: ${MINIO_MC_IMAGE:?Run navigator host-init first}
    depends_on: [minio]
    entrypoint: ["/bin/sh", "/bootstrap/storage.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Required}
      TRACE_S3_ACCESS_KEY: ${TRACE_S3_ACCESS_KEY:?Required}
      TRACE_S3_SECRET_KEY: ${TRACE_S3_SECRET_KEY:?Required}
    volumes: ["./init-storage.sh:/bootstrap/storage.sh:ro", "./policies:/policies:ro"]

  redis:
    profiles: [observability]
    image: ${REDIS_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    profiles: [observability]
    image: ${CLICKHOUSE_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Required}
      CLICKHOUSE_DB: default
    volumes: ["clickhouse-data:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  langfuse-worker:
    profiles: [observability]
    image: ${LANGFUSE_WORKER_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment: &langfuse-environment
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Required}
      SALT: ${LANGFUSE_SALT:?Required}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Required}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${TRACE_S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${TRACE_S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${TRACE_S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${TRACE_S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  langfuse-web:
    profiles: [observability]
    image: ${LANGFUSE_WEB_IMAGE:?Run navigator host-init first}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *langfuse-environment
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000

volumes:
  postgres-data:
  artifacts:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
